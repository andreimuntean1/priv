name: private_messaging
description: A private messaging Flutter application with Supabase backend
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Supabase Integration
  supabase_flutter: ^2.3.4
  
  # HTTP & Networking
  http: ^1.1.2
  
  # File & Image Handling
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  cached_network_image: ^3.3.1
  
  # Video & Media Processing
  video_player: ^2.8.1
  video_compress: ^3.1.3
  video_thumbnail: ^0.5.3
  image: ^4.1.3
  path: ^1.8.3
  
  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.2.1
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  flutter_dotenv: ^5.1.0
  
  # Firebase Core (Required for all Firebase services)
  firebase_core: ^2.24.2

  # Notifications  
  firebase_messaging: ^14.7.15
  flutter_local_notifications: ^17.2.2
  
  # Permissions
  permission_handler: ^11.2.0
  
  # Deep Linking
  app_links: ^3.4.5
  
  # Google Fonts
  google_fonts: ^6.1.0
  
  # App Version Info
  package_info_plus: ^4.2.0
  
  # URL Launcher
  url_launcher: ^6.2.2

  # Dynamic App Icons

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/android/
    - assets/.env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#A1E44D"
  adaptive_icon_foreground: "assets/icons/app_icon.png"